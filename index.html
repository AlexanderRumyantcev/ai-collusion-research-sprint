:root[data-theme="dark"]{

.top{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}

function weight(adm,aut,dc,rel){
 if(adm==='нет')return {w:null,why:'adm'};
 if(aut==='нет')return {w:null,why:'aut'};
 if(rel==='ненадёжен')return {w:0,why:'unr'};
 const tbl={'прямая|надёжен':4,'прямая|сомнителен':3,'косвенная|надёжен':2,'косвенная|сомнителен':1};
 return {w:tbl[dc+'|'+rel],why:null};
}

];
const ST={type:'fals',std:3,on:{},adm:{},aut:{},dc:{},rel:{}};
F.forEach(f=>{ST.on[f.id]=false;ST.adm[f.id]='да';ST.aut[f.id]='да';ST.dc[f.id]=f.dc;ST.rel[f.id]='надёжен'});
ST.on.f2=ST.on.f4=ST.on.f13=true;
function elementState(el){
 const items=F.filter(f=>ST.on[f.id]&&f.el.includes(el));const pro={},con={};
 items.forEach(f=>{const r=weight(ST.adm[f.id],ST.aut[f.id],ST.dc[f.id],ST.rel[f.id]);if(r.w===null)return;const m=f.dir>0?pro:con;m[f.g]=Math.max(m[f.g]||0,r.w)});
 const pw=Object.values(pro),cw=Object.values(con);let P=pw.length?Math.max(...pw):0;const C=cw.length?Math.max(...cw):0;
 const corro=pw.filter(v=>v>=2).length>=2;if(corro)P=Math.min(4,P+1);
 if(C>=4)return {e:0,k:'x',corro,C,P};
 if(C>0&&C>=P)return {e:0,k:'c',corro,C,P};
 return {e:P,k:'n',corro,C,P};
}
function levelOf(states){
 if(states.some(s=>s.k==='x'))return 0;
 const E=states.map(s=>s.e),mn=Math.min(...E),mx=Math.max(...E);const corroAll=states.every(s=>s.corro),noCon=states.every(s=>s.C===0);
 if(mn>=4&&corroAll&&noCon)return 6;if(mn>=3&&corroAll)return 5;if(mn>=3)return 4;if(mn>=2)return 3;if(mn>=1)return 2;if(mx>=1)return 1;return 0;
}
function meets(rank,s){if(rank<=2)return s.e>=1;if(rank===3)return s.e>=2;if(rank===4)return s.e>=3;if(rank===5)return s.e>=3&&s.corro;return s.e>=4&&s.corro&&s.C===0}
function buildV2(){
 $('v2').innerHTML=`<div class="card law"><span class="tag law">${KIND[lang].lit}</span><h2>${u('c0')}</h2><p>${u('c0t')}</p></div>
 <div class="arrow"><b>↑</b>${u('up1')}</div>
 <div class="card law"><h3>${u('tType')}</h3><div class="opts" id="types"></div><p class="note" id="typeNote"></p></div>
 <div class="arrow"><b>↑</b>${u('up2')}</div>
 <div class="card law"><h3>${u('tStd')}</h3><p class="note">${u('tStdN')}</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><label for="std">${u('goal')}</label><select class="big" id="std"></select></div>
  <div class="result" id="res2" aria-live="polite"></div><p class="note" id="miss"></p></div>
 <div class="arrow"><b>↑</b>${u('up3')}</div>
 <h3>${u('elH')}</h3><div class="els" id="els"></div>
 <div class="arrow"><b>↑</b>${u('up4')}</div>
 <div class="card ours"><h3>${u('evH')}</h3><p class="note">${u('evN')}</p><div class="rows" id="rows"></div></div>`;
}
function r2(){
 const T=TYPES[ST.type];
 opts('types',Object.keys(TYPES).map(k=>[k,x(TYPES[k].n)]),ST.type,v=>ST.type=v);
 $('typeNote').textContent=x(T.t);
 const sel=$('std');sel.innerHTML=STD[lang].map((n,i)=>`<option value="${i+1}" ${ST.std===i+1?'selected':''}>${n}</option>`).join('');sel.onchange=()=>{ST.std=+sel.value;r2()};
 const states=T.el.map(k=>[k,elementState(k)]);const lvl=levelOf(states.map(a=>a[1]));const excl=states.some(a=>a[1].k==='x');const ok=!excl&&lvl>=ST.std;
 const res=$('res2');res.classList.toggle('bad',!ok);const G2=u('goalSt');
 res.innerHTML=`<h3>${u('reached')}${excl?u('excl'):lvl===0?u('below'):STD[lang][lvl-1]}</h3><p>${G2[0]}${STD[lang][ST.std-1]}${G2[1]}<b>${ok?G2[2]:G2[3]}</b>.</p>`;
 const miss=states.filter(a=>!meets(ST.std,a[1])).map(a=>x(EL[a[0]][0]));
 $('miss').textContent=excl?'':(ST.std===1?(lvl>=1?'':u('noEl')):(miss.length?u('miss')+miss.length+'): '+miss.join(', ')+'.':u('missE')));
 $('els').innerHTML=states.map(([k,s])=>{
  const cls=s.k==='x'?'sx':s.k==='c'?'sc':'s'+s.e;
  const att=F.filter(f=>ST.on[f.id]&&f.el.includes(k)).map(f=>{const r=weight(ST.adm[f.id],ST.aut[f.id],ST.dc[f.id],ST.rel[f.id]);return `<span class="chip ${r.w===null?'wx':'w'+r.w}" title="${x(f.fact)}">${f.id}: ${r.w===null?u('notEv'):(f.dir>0?'+':'−')+r.w}</span>`}).join('')||`<span class="note">${u('noItems')}</span>`;
  const st=s.k==='x'?u('stX'):s.k==='c'?u('stC'):u('stN')[s.e]+(s.corro?u('stCo'):'');
  return `<div class="el ${cls}"><div class="head"><h3>${x(EL[k][0])}</h3><span class="chip">${st}</span></div><p class="note">${x(EL[k][1])}</p><div class="att">${att}</div></div>`}).join('');
 const used=F.filter(f=>f.el.some(e=>T.el.includes(e)));
 $('rows').innerHTML=used.map(f=>{const r=weight(ST.adm[f.id],ST.aut[f.id],ST.dc[f.id],ST.rel[f.id]);
  const o=(id,vals,cur)=>`<select id="${id}_${f.id}" aria-label="${id}">${vals.map(([v,t])=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`).join('')}</select>`;
  return `<div class="row"><input type="checkbox" id="c_${f.id}" ${ST.on[f.id]?'checked':''} aria-label="${f.id}"><label for="c_${f.id}">${f.id}. ${x(f.t)}<small>${x(SRC[f.s].n)}; ${(f.dir>0?u('dirP'):u('dirN')).toLowerCase()}</small><small><b>${u('estab')}</b> ${x(f.fact)}. ${u('elems')} ${f.el.map(e=>x(EL[e][0])).join(', ')}</small></label><div class="sel">${u('admL')} ${o('adm',YN(),ST.adm[f.id])} ${u('autL')} ${o('aut',YN(),ST.aut[f.id])} ${o('dc',['прямая','косвенная'].map(k=>[k,u('dc')[k]]),ST.dc[f.id])} ${o('rel',['надёжен','сомнителен','ненадёжен'].map(k=>[k,u('rel')[k]]),ST.rel[f.id])} ${chip(r.w,f.dir)}</div></div>`}).join('');
 used.forEach(f=>{$('c_'+f.id).onchange=e=>{ST.on[f.id]=e.target.checked;r2()};['adm','aut','dc','rel'].forEach(k=>{$(k+'_'+f.id).onchange=e=>{ST[k][f.id]=e.target.value;r2()}})});
}

function renderStatic(){
 document.documentElement.lang=lang;
 $('h1').textContent=u('h1');$('lead').textContent=u('lead');$('t1').textContent=u('t1');$('t2').textContent=u('t2');
 $('gsum').textContent=u('gsum');$('gnote').textContent=u('gnote');$('lsum').textContent=u('lsum');$('lnote').textContent=u('lnote');
 $('lru').setAttribute('aria-pressed',String(lang==='ru'));$('len').setAttribute('aria-pressed',String(lang==='en'));
 const th=u('th');
 $('gtab').innerHTML=`<tr>${th.map(h=>`<th>${h}</th>`).join('')}</tr>`+G.map(r=>`<tr><td><b>${lang==='ru'?r[0]:r[1]}</b></td><td>${lang==='ru'?r[2]:r[3]}</td><td><span class="tag ${r[4]==='lit'?'law':r[4]}">${KIND[lang][r[4]]}</span></td><td>${r[5].length?cite(r[5]):'—'}</td></tr>`).join('');
 $('lit').innerHTML=Object.keys(REF).sort((a,b)=>a-b).map(i=>`<li value="${i}">${x(REF[i][0])}${REF[i][1].map(l=>`<a href="${l}" target="_blank" rel="noopener">${l}</a>`).join('')}</li>`).join('');
}
function renderAll(){renderStatic();buildV1();buildV2();r1();r2()}
function tab(n){$('v1').hidden=n!==1;$('v2').hidden=n!==2;$('t1').setAttribute('aria-pressed',String(n===1));$('t2').setAttribute('aria-pressed',String(n===2))}
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){};renderAll()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('lru').onclick=()=>setLang('ru');$('len').onclick=()=>setLang('en');
renderAll();tab(1);
</script>
